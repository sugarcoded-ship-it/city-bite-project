# Initialize the Port
server.port=${BACKEND_PORT:8080}

# Initialize the PostgresSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:restaurant}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update

# Avoid starting Docker Compose services automatically when running locally
spring.docker.compose.enabled=false

# Read directly from Docker's injected environment variables
keycloak.admin-user=${KEYCLOAK_ADMIN_USER}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.server-url=${KEYCLOAK_URL:http://localhost/auth/}
keycloak.realm=${KEYCLOAK_REALM:restaurant-realm}

# Both browser and backend now agree on the exact same issuer identity string
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://localhost/auth/}realms/${KEYCLOAK_REALM:restaurant-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://keycloak:8080/auth}/realms/${KEYCLOAK_REALM:restaurant-realm}/protocol/openid-connect/certs