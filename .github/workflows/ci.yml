name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches:
      - '**'

jobs:
  backend-build:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/backend/restaurant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradle Wrapper
        run: chmod +x gradlew
      
      - name: Compile and Test with Gradle
        run: ./gradlew build

  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/frontend/restaurant
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: codes/frontend/restaurant/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build
